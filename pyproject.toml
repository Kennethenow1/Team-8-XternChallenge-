[project]
name = "team8-miso-queue"
version = "0.1.0"
description = "Point-in-time Bronze–Silver–Gold MISO interconnection queue database"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=17",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "plotly>=5.22",
  "seaborn>=0.13",
  "matplotlib>=3.8",
  "lifelines>=0.29",
  "scikit-survival>=0.23",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "nbconvert>=7.16",
  "nbformat>=5.10",
  "jupyter>=1.0",
  "ipykernel>=6.29",
  "kaleido>=0.2.1",
  "catboost>=1.2",
  "xgboost>=2.1",
  "optuna>=4.0",
  "tabicl>=2.0",
  "tabpfn>=2.0",
  "tabm>=0.0.3",
  "torch>=2.2",
  "timesfm[torch]>=1.3",
  "tensorflow[and-cuda]>=2.16",
  "playwright>=1.62.0",
  "pdfplumber>=0.11.10",
  "pymupdf>=1.28.2",
]

[project.scripts]
run-pipeline = "scripts.run_pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
